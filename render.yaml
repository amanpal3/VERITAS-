services:
  # ==========================================
  # VERITAS Backend - FastAPI
  # ==========================================
  - type: web
    name: veritas-backend
    env: python
    plan: free
    branch: devlop

    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHONPATH
        value: .

      - key: ENVIRONMENT
        value: production

      - key: NEO4J_URI
        sync: false

      - key: NEO4J_USER
        sync: false

      - key: NEO4J_PASSWORD
        sync: false

      - key: SENTRY_DSN
        sync: false

  # ==========================================
  # VERITAS Frontend - React/Vite
  # ==========================================
  - type: web
    name: veritas-frontend
    env: static
    branch: devlop

    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: veritas-backend
          envVarKey: RENDER_EXTERNAL_URL
